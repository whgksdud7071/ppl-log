<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>운동 기록</title>
<meta name="theme-color" content="#eceff1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="운동 기록">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 폰 한 손 조작용 한 칼럼. 위에 날짜와 루틴, 가운데 종목 목록, 아래 탭. 입력 버튼은 엄지가 닿는 아래쪽에 둔다. */
:root{
  --bg:#eceff1; --surface:#ffffff; --ink:#12171c; --muted:#5a6672; --line:#d6dbe0;
  --accent:#e4572e; --accent-ink:#ffffff;
  --c0:#3a6fd8; --c1:#7b9de4; --c2:#14917f; --c3:#58b3a5; --c4:#b97d12; --c5:#8a5cc7; --c6:#c94f7c; --c7:#5f7383;
  --up:#d6303a; --down:#2563d9;
  --font-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-num:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1317; --surface:#192027; --ink:#e9edf0; --muted:#8e9aa6; --line:#2b353e;
    --accent:#ff7a4d; --accent-ink:#1a0c06;
    --c0:#6d9bff; --c1:#a9c2ff; --c2:#3cc7b3; --c3:#86e0d2; --c4:#e6b04a; --c5:#b48cf0; --c6:#f07fa8; --c7:#9fb0bf;
    --up:#ff5c63; --down:#5b93ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1317; --surface:#192027; --ink:#e9edf0; --muted:#8e9aa6; --line:#2b353e;
  --accent:#ff7a4d; --accent-ink:#1a0c06;
  --c0:#6d9bff; --c1:#a9c2ff; --c2:#3cc7b3; --c3:#86e0d2; --c4:#e6b04a; --c5:#b48cf0; --c6:#f07fa8; --c7:#9fb0bf;
  --up:#ff5c63; --down:#5b93ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) 96px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,.datepick:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;display:grid;gap:10px}
.h1{margin:0;font-size:20px;font-weight:700;min-height:44px;display:flex;align-items:center}

.datebar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.datepick{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:34px}
.datepick span{font-size:20px;font-weight:700}
.datepick em{font-style:normal;font-size:12px;font-weight:700;color:var(--accent)}
.datepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.dl{display:grid;min-width:0}
.stat{font-size:13px;color:var(--muted)}
.stat b{font-family:var(--font-num);font-size:19px;color:var(--ink);margin:0 2px 0 3px}
.stat .rem{color:var(--accent)}
.el{text-align:right;white-space:nowrap;line-height:1.2}
.el small{display:block;font-size:11px;color:var(--muted)}
.ev{font-size:14px;color:var(--muted)}
.ev b{font-family:var(--font-num);font-size:26px;color:var(--ink);margin:0 2px 0 4px}
.sum{font-family:var(--font-num);font-size:15px;color:var(--muted);white-space:nowrap}
.sum b{font-size:24px;font-weight:700;color:var(--ink);margin:0 3px 0 8px}
.sum b:first-child{margin-left:0}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.seg button{background:var(--surface);border-radius:10px;min-height:48px;font-weight:700;font-size:14px;color:var(--muted);border-top:4px solid var(--line)}
.seg button[aria-pressed="true"]{color:var(--ink);box-shadow:0 0 0 1px var(--line);border-top-color:var(--rc)}
.seg button{padding:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg .rtadd{border-top:4px solid transparent;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);font-size:22px;font-weight:500}
.rtedit{display:grid;gap:4px;margin-top:10px}
.rtrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.rtrow input{min-width:0;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;font-weight:700}
.rtdel{min-height:44px;padding:0 12px;color:var(--muted);font-size:13px;text-decoration:underline}
body.setup .nav{display:none}
.surow{display:grid;grid-template-columns:10px minmax(0,1fr);gap:12px;align-items:center;margin-top:8px}
.surow .dot{margin:0}
.surow input{min-width:0;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;font-weight:700}
.sufill{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:10px;font-size:14px;cursor:pointer}
.sufill input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.hint{margin:4px 0 0;font-size:12px;color:var(--muted)}
.sugo{margin-top:16px}

.note{color:var(--muted);margin:16px 0;text-align:center}
.banner{margin:6px 0 0;padding:10px 12px;border-radius:10px;background:var(--surface);color:var(--muted);font-size:13px;border:1px solid var(--line)}

.ex{background:var(--surface);border-radius:12px;margin-top:10px;overflow:hidden}
.exhead,.seg button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ex,.seg button{position:relative}
.dragging{z-index:5;box-shadow:0 14px 34px rgba(0,0,0,.32),0 0 0 2px var(--accent);will-change:transform}
.ex.dragging{overflow:visible}
body.drag{-webkit-user-select:none;user-select:none;cursor:grabbing}

/* 편집 모드 손잡이(≡) */
.grip{grid-area:b;justify-self:end;width:44px;height:44px;margin:-8px -10px -8px 0;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab}
.grip::before{content:"";width:18px;height:12px;background:linear-gradient(currentColor 0 0) 0 0/100% 2px no-repeat,linear-gradient(currentColor 0 0) 0 5px/100% 2px no-repeat,linear-gradient(currentColor 0 0) 0 10px/100% 2px no-repeat;border-radius:1px}
.edithint{display:flex;align-items:center;gap:8px;margin:12px 2px 0;font-size:13px;color:var(--muted)}
.edithint .grip{width:auto;height:auto;margin:0}
.edithint .grip::before{width:14px;height:10px;background-size:100% 1.5px;background-position:0 0,0 4px,0 8px}
body.editing .seg [data-act="routine"]{touch-action:none}
body.editing .seg [data-act="routine"]::after{content:"";position:absolute;left:50%;bottom:6px;width:12px;height:6px;margin-left:-6px;opacity:.45;background:linear-gradient(currentColor 0 0) 0 0/100% 1.5px no-repeat,linear-gradient(currentColor 0 0) 0 4px/100% 1.5px no-repeat}

/* 처음 한 번 뜨는 말풍선 */
.tip{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;margin:14px 0 4px;padding:14px 8px 14px 16px;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.18);animation:tipin .42s cubic-bezier(.2,.8,.2,1) .25s both}
.tip::before{content:"";position:absolute;top:-6px;left:26px;width:13px;height:13px;background:inherit;border-radius:3px 0 0 0;transform:rotate(45deg)}
.tip.out{animation:tipout .22s ease-in both}
.tiptx{display:grid;gap:1px;min-width:0}
.tiptx b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.tiptx span{font-size:13px;opacity:.72}
.tip button{min-height:44px;padding:0 12px;font-weight:700;font-size:14px;color:var(--accent)}
.tipic{position:relative;width:26px;height:28px}
.tipic i{position:absolute;left:0;right:0;height:11px;border-radius:3px;background:currentColor;opacity:.35}
.tipic i:first-child{top:0;background:var(--accent);opacity:1;z-index:1;animation:tipa 1.5s cubic-bezier(.4,0,.2,1) .8s infinite alternate}
.tipic i:last-child{top:16px;animation:tipb 1.5s cubic-bezier(.4,0,.2,1) .8s infinite alternate}
@keyframes tipin{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes tipout{to{opacity:0;transform:translateY(-4px) scale(.98)}}
@keyframes tipa{0%,15%{transform:none}30%{transform:scale(1.12)}75%{transform:translateY(16px) scale(1.12)}90%,100%{transform:translateY(16px)}}
@keyframes tipb{0%,35%{transform:none}75%,100%{transform:translateY(-16px)}}
@media (prefers-reduced-motion:reduce){.tip,.tipic i{animation:none!important}}
.exhead{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n b" "m b";align-items:center;gap:2px 12px;width:100%;text-align:left;padding:12px 14px;min-height:60px}
.exname{grid-area:n;font-weight:700;font-size:16px}
.exmeta{grid-area:m;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{grid-area:b;font-family:var(--font-num);font-weight:700;font-size:20px;color:var(--accent);min-width:2.5em;text-align:right}
.logger{padding:4px 14px 16px;border-top:1px solid var(--line);display:grid;gap:12px}
.sets{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.sets:empty{display:none}
.sets li{display:grid;grid-template-columns:24px minmax(0,1fr) auto 44px;align-items:center;gap:8px;min-height:44px;background:var(--bg);border-radius:8px;padding-left:10px}
.no{font-family:var(--font-num);font-weight:700;color:var(--muted)}
.val{font-family:var(--font-num);font-size:18px}
.val b{font-weight:700;font-size:24px}
.rm1{font-size:12px;color:var(--muted)}
.del{width:44px;height:44px;font-size:22px;color:var(--muted)}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;min-width:0}
.lab{font-size:12px;color:var(--muted);font-weight:500}
.stepper{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:stretch;background:var(--bg);border-radius:10px;min-height:52px}
.stepper button{font-size:24px}
.stepper input{width:100%;min-width:0;text-align:center;font-family:var(--font-num);font-size:28px;font-weight:700;background:transparent;border:0;color:var(--ink);padding:0}
.rec{width:100%;min-height:52px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
.ref{margin:0;color:var(--muted);font-size:13px}
.rmrow{padding:0 14px 12px}
.rmrow button{font-size:13px;color:var(--muted);text-decoration:underline;min-height:36px}
.tools{display:grid;gap:10px;margin-top:16px}
.tools form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.tools input{min-width:0;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit}
.tools form button{min-height:48px;padding:0 18px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.ghost{min-height:44px;color:var(--muted);font-weight:500;text-decoration:underline}

.day{background:var(--surface);border-radius:12px;margin-top:10px;padding:4px 14px 12px}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:48px;text-align:left}
.dayd{font-weight:700}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid currentColor;margin-left:8px}
.pill{color:var(--rc)}
.dayvol{font-family:var(--font-num);font-size:16px;color:var(--muted);white-space:nowrap}
.daylist{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.daylist li{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 32px;gap:8px;align-items:center}
.daylist .s{color:var(--muted);font-family:var(--font-num);font-size:16px}
.daylist .x{width:32px;height:32px;font-size:17px;line-height:1;color:var(--muted);opacity:.6;justify-self:end}

.card{background:var(--surface);border-radius:12px;padding:14px;margin-top:10px}
.card h2{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.week{font-family:var(--font-num);font-size:16px;color:var(--muted)}
.week b{font-size:26px;color:var(--ink);margin:0 3px 0 8px}
.week b:first-child{margin-left:0}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--font-num);font-size:11px}
.chart line{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.dot{background:var(--rc)}
.pr{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n big" "d sp";gap:2px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pr:first-of-type{border-top:0}
.pr .n{grid-area:n;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .d{grid-area:d;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .d span{font-family:var(--font-num);font-size:15px;font-weight:700}
.pr .d .up{color:var(--up)}.pr .d .down{color:var(--down)}.pr .d .same{color:var(--muted)}
.pr .big{grid-area:big;font-family:var(--font-num);font-size:26px;font-weight:700;text-align:right}
.pr .big small{font-size:12px;color:var(--muted);font-weight:500;margin-left:3px}
.pr .sp{grid-area:sp;justify-self:end;height:26px}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--accent)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{min-height:56px;font-weight:700;color:var(--muted);border-top:3px solid transparent}
.nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
.rest{position:fixed;left:0;right:0;bottom:calc(57px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.restin{max-width:520px;margin:0 auto;display:grid;grid-template-columns:auto auto minmax(0,1fr) 44px;align-items:center;gap:12px;min-height:56px}
.reststop{width:44px;height:44px;margin-right:-10px;font-size:18px;color:var(--muted)}
.rest.done .reststop{color:var(--accent-ink)}
.restlab{font-size:13px;color:var(--muted);font-weight:700}
.resttime{font-family:var(--font-num);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;min-width:2.4em}
.restbar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.restbar i{display:block;height:100%;width:0;background:var(--accent)}
.rest.done{background:var(--accent);color:var(--accent-ink);border-top-color:var(--accent)}
.rest.done .restlab{color:var(--accent-ink)}
.rest.done .restbar{background:color-mix(in srgb,var(--accent-ink) 25%,transparent)}
.rest.done .restbar i{background:var(--accent-ink)}
body.resting{padding-bottom:164px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(128px + env(safe-area-inset-bottom,0px));z-index:40;
  display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:14px}
.toast button{font-weight:700;text-decoration:underline;min-height:32px}
@media (prefers-reduced-motion:no-preference){.logger{animation:open .14s ease-out}@keyframes open{from{opacity:.4}to{opacity:1}}}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top" id="head"></header>
  <main id="view"></main>
</div>
<nav class="nav" aria-label="화면 이동"><div>
  <button data-act="tab" data-t="log">운동</button>
  <button data-act="tab" data-t="hist">지난 기록</button>
  <button data-act="tab" data-t="sum">요약</button>
</div></nav>
<div class="rest" id="rest" hidden><div class="restin"><span class="restlab" id="restlab">휴식</span><span class="resttime" id="resttime">1:30</span><div class="restbar"><i id="restfill"></i></div><button class="reststop" data-act="reststop" aria-label="휴식 타이머 끄기">✕</button></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  /* 루틴: k는 기록에 저장되는 고정 키(이름 바꿔도 안 변함), c는 색 번호(--c0~7), off는 지운 루틴(기록 표시용으로 남김) */
  var ROUTINES0=[{k:'pushA',label:'푸시1',c:0},{k:'pushB',label:'푸시2',c:1},{k:'pullA',label:'풀1',c:2},{k:'pullB',label:'풀2',c:3},{k:'legs',label:'하체',c:4}];
  var ROUTINES=JSON.parse(JSON.stringify(ROUTINES0)), MAX_R=6, COLORS=8;
  var DEFAULTS={
    pushA:['오버헤드 바벨 프레스','인클라인 덤벨 벤치 프레스','시티드 덤벨 레터럴 레이즈','덤벨 오버헤드 숄더 프레스','트라이셉스 케이블 익스텐션','인클라인 덤벨 플라이'],
    pushB:['플랫 바벨 벤치 프레스','스탠딩 덤벨 레터럴 레이즈','덤벨 오버헤드 숄더 프레스','케이블 크로스오버','케이블 페이스 풀','딥스'],
    pullA:['와이드 그립 풀업','와이드 그립 랫 풀다운','체스트 서포티드 인클라인 덤벨 로우','스트레이트 암 케이블 풀다운','리버스 팩덱 플라이','인클라인 덤벨 바이셉스 컬'],
    pullB:['바벨 벤트오버 로우','싱글암 덤벨 로우','브이바 케이블 랫 풀다운','리버스 팩덱 플라이','해머 컬','바벨 슈러그'],
    legs:['스쿼트','레그프레스','루마니안 데드리프트','레그 익스텐션','레그 컬','카프 레이즈']
  };
  /* 처음 설정: 분할 수별 추천 루틴 이름과 종목 */

  }

    var sets=x.sets.filter(function(s){return s&&isFinite(s.w)&&isFinite(s.r)&&s.r>0}).map(function(s){return {w:Number(s.w),r:Number(s.r)}});

    try{

      // 멈춰 있으면 깨운 뒤 재생. 못 깨우면 음성 안내로 넘긴다

        '<div class="field"><span class="lab">횟수</span><div class="stepper">'+
          '<button data-act="adj" data-ex="'+q+'" data-f="r" data-d="-1" aria-label="횟수 1 줄이기">−</button>'+
          '<input id="in-r" data-ex="'+q+'" data-f="r" type="text" inputmode="numeric" autocomplete="off" value="'+esc(dr.r)+'" aria-label="횟수">'+
          '<button data-act="adj" data-ex="'+q+'" data-f="r" data-d="1" aria-label="횟수 1 늘리기">+</button></div></div>'+
      '</div>'+
      '<button class="rec" data-act="add" data-ex="'+q+'">'+(n+1)+'세트 기록</button>'+
      '<p class="ref">'+(prev?'지난번 '+shortDate(prev.date)+' · '+esc(prev.sets.map(setTxt).join(', ')):'이 종목은 아직 기록이 없어. 첫 세트를 넣어봐.')+'</p></div>';
    }

      html+='<div class="rmrow"><button data-act="rmex" data-ex="'+esc(name)+'">'+(state.rm===name?'한 번 더 누르면 목록에서 빠져':'이 종목 목록에서 빼기')+'</button></div>';
    }
    return html+'</section>';
  }

  function logHTML(){
    var names=listFor(state.routine),byEx=exIndex(),html='';
    if(state.err)html+='<p class="banner">기록을 불러오지 못했어. 잠시 뒤에 다시 열어줘.</p>';
    if(!state.loaded)html+='<p class="note">불러오는 중…</p>';
    if(state.edit&&names.length>1)html+='<p class="edithint"><i class="grip" aria-hidden="true"></i>잡고 끌면 순서가 바뀌어</p>';
    var tip=!state.edit&&state.loaded&&names.length>1&&!tipSeen();
    html+=names.length?names.map(function(n,i){return exHTML(n,byEx)+(tip&&i===0?tipHTML():'')}).join(''):'<p class="note">이 루틴에 종목이 없어. 아래 종목 편집에서 추가해줘.</p>';
    html+='<div class="tools">'+(state.edit?'<form id="addex"><input id="newex" maxlength="30" placeholder="종목 이름 (예: 케이블 크로스오버)" autocomplete="off"><button type="submit">추가</button></form>':'')+
      '<button class="ghost" id="edit-btn" data-act="edit">'+(state.edit?'편집 끝내기':'종목 편집')+'</button></div>';

  function histHTML(){
    var by=new Map();
    state.docs.forEach(function(d){var a=by.get(d.date);if(!a){a=[];by.set(d.date,a)}a.push(d)});
    var dates=Array.from(by.keys()).sort().reverse().slice(0,40);
    if(!dates.length)return '<p class="note">'+(state.loaded?'아직 기록이 없어. 운동 탭에서 첫 세트를 넣어봐.':'불러오는 중…')+'</p>';
    return dates.map(function(dt){
      var ds=by.get(dt).sort(function(a,b){return a.ts-b.ts}),vol=0,rs=[];
      ds.forEach(function(d){vol+=volOf(d.sets);if(rs.indexOf(d.routine)<0)rs.push(d.routine)});
      return '<article class="day"><button class="dayhead" data-act="goto" data-date="'+dt+'" data-r="'+ds[0].routine+'"><span><span class="dayd">'+labelDate(dt)+'</span>'+
        rs.map(function(r){return '<span class="pill" style="--rc:'+rColor(r)+'">'+esc(rLabel(r))+'</span>'}).join('')+'</span><span class="dayvol">'+fmtVol(vol)+'kg</span></button>'+
        '<ul class="daylist">'+ds.map(function(d){return '<li><span class="n">'+esc(d.exercise)+'</span><span class="s">'+d.sets.map(setTxt).join('  ')+'</span>'+
          '<button class="x" data-act="deldoc" data-id="'+esc(d.id)+'" aria-label="'+esc(labelDate(dt)+' '+d.exercise)+' 기록 지우기">×</button></li>'}).join('')+'</ul></article>';
    }).join('');
  }

  function niceMax(m){if(m<=0)return 1000;var p=Math.pow(10,Math.floor(Math.log10(m))),f=m/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
  function weekChart(weeks,keys){
    var W=320,x0=40,top=10,ph=100,bw=26,n=weeks.length,gap=(W-x0-4-n*bw)/(n-1);
    var mx=niceMax(Math.max.apply(null,weeks.map(function(w){return w.total})));
    var out='<svg class="chart" viewBox="0 0 '+W+' 140" role="img" aria-label="최근 8주 주별 운동 볼륨">';
    out+='<line x1="'+x0+'" x2="'+(W-4)+'" y1="'+(top+ph)+'" y2="'+(top+ph)+'"/><line x1="'+x0+'" x2="'+(W-4)+'" y1="'+top+'" y2="'+top+'"/>';
    out+='<text x="'+(x0-6)+'" y="'+(top+ph+4)+'" text-anchor="end">0</text><text x="'+(x0-6)+'" y="'+(top+4)+'" text-anchor="end">'+fmtVol(mx)+'</text>';
    weeks.forEach(function(w,i){
      var x=x0+i*(bw+gap),y=top+ph;
      keys.forEach(function(k){
        var h=(w.v[k]||0)/mx*ph;if(h<=0)return;y-=h;
        out+='<rect style="fill:'+rColor(k)+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw+'" height="'+h.toFixed(1)+'" rx="2"/>';
      });
      out+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(top+ph+16)+'" text-anchor="middle">'+shortDate(w.start)+'</text>';
    });
    return out+'</svg>';
  }
  function spark(vals){
    vals=vals.slice(-12);if(vals.length<2)return '';
    var w=84,h=26,p=3,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=mx-mn;
    var pts=vals.map(function(v,i){return [p+i*(w-2*p)/(vals.length-1),rg?h-p-(v-mn)/rg*(h-2*p):h/2]});
    var last=pts[pts.length-1];
    return '<svg class="sp spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true"><polyline points="'+pts.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' ')+'"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3"/></svg>';
  }
  function sumHTML(){
    var wk=new Map();
    state.docs.forEach(function(d){
      var ws=weekStart(d.date),o=wk.get(ws);
      if(!o){o={v:{},total:0,days:new Set(),sets:0};wk.set(ws,o)}
      var vl=volOf(d.sets);o.v[d.routine]=(o.v[d.routine]||0)+vl;o.total+=vl;o.days.add(d.date);o.sets+=d.sets.length;
    });
    var empty={v:{},total:0,days:new Set(),sets:0};
    var cur=weekStart(today()),weeks=[];
    for(var i=7;i>=0;i--){var s=addDays(cur,-7*i),o=wk.get(s)||empty;weeks.push({start:s,v:o.v,total:o.total})}
    var tw=wk.get(cur)||empty;
    // 그래프에 나온 루틴만, 루틴 순서대로 쌓는다
    var keys=ROUTINES.map(function(r){return r.k});
    weeks.forEach(function(w){Object.keys(w.v).forEach(function(k){if(keys.indexOf(k)<0)keys.push(k)})});
    keys=keys.filter(function(k){return weeks.some(function(w){return w.v[k]>0})});
    var html='<section class="card"><h2>이번 주</h2><div class="week"><b>'+tw.days.size+'</b>일<b>'+tw.sets+'</b>세트<b>'+fmtVol(tw.total)+'</b>kg</div></section>';
    html+='<section class="card"><h2>주별 볼륨 (최근 8주, kg)</h2>'+(keys.length?weekChart(weeks,keys)+'<div class="legend">'+keys.map(function(k){return '<span><i class="dot" style="--rc:'+rColor(k)+'"></i>'+esc(rLabel(k))+'</span>'}).join('')+'</div>':'<p class="note">기록이 쌓이면 주별 볼륨이 여기에 그려져.</p>')+'</section>';
    var m=new Map();
    state.docs.forEach(function(d){
      var o=m.get(d.exercise);if(!o){o={name:d.exercise,routine:d.routine,pts:new Map(),top:new Map(),best:null,last:''};m.set(d.exercise,o)}
      var day=0,tw=0,tr=0;
      d.sets.forEach(function(s){var sc=score(s);if(sc>day)day=sc;if(!o.best||sc>o.best.sc)o.best={sc:sc,w:s.w,r:s.r,date:d.date};if(s.w>tw)tw=s.w;if(s.r>tr)tr=s.r});
      o.pts.set(d.date,Math.max(o.pts.get(d.date)||0,day));if(d.date>o.last)o.last=d.date;
      var pt=o.top.get(d.date)||{w:0,r:0};o.top.set(d.date,{w:Math.max(pt.w,tw),r:Math.max(pt.r,tr)});
    });
    /* 최근 날짜의 최고 중량 vs 바로 전 날짜. 맨몸 운동끼리는 최고 횟수로 비교. 오르면 빨강 +, 내리면 파랑 - */
    function recentHTML(p){
      var ds=Array.from(p.top.keys()).sort(),cur=p.top.get(ds[ds.length-1]),prv=ds.length>1?p.top.get(ds[ds.length-2]):null;
      var bw=cur.w<=0,txt='최근 '+(bw?cur.r+'회':fmtNum(cur.w)+'kg');
      if(!prv||(bw!==(prv.w<=0)))return txt;
      var df=bw?cur.r-prv.r:Math.round((cur.w-prv.w)*10)/10;
      return txt+' '+(df>0?'<span class="up">+'+fmtNum(df)+'</span>':df<0?'<span class="down">−'+fmtNum(-df)+'</span>':'<span class="same">±0</span>');
    }
    var prs=Array.from(m.values()).sort(function(a,b){return a.last<b.last?1:a.last>b.last?-1:0});
    html+='<section class="card"><h2>종목별 최고 기록</h2>'+(prs.length?prs.map(function(p){
      var series=Array.from(p.pts.entries()).sort(function(a,b){return a[0]<b[0]?-1:1}).map(function(x){return x[1]});
      return '<div class="pr"><span class="n">'+esc(p.name)+'</span><span class="big">'+fmtNum(p.best.sc)+'<small>'+(p.best.w>0?'kg 1RM':'회')+'</small></span>'+
        '<span class="d">'+recentHTML(p)+' · 최고 '+setTxt(p.best)+' '+shortDate(p.best.date)+'</span>'+spark(series)+'</div>';
    }).join(''):'<p class="note">종목별 최고 기록은 첫 세트를 넣으면 여기에 나와.</p>')+'</section>';
    return html;
  }

  function render(){
    var app=$('#app'),a=document.activeElement,fid=a&&a.id&&app.contains(a)?a.id:null,pos=null;
    if(fid&&typeof a.selectionStart==='number')pos=[a.selectionStart,a.selectionEnd];
    document.body.classList.toggle('setup',!!state.setup);
    document.body.classList.toggle('editing',!!state.edit&&state.tab==='log'&&!state.setup);
    if(state.setup){$('#head').innerHTML='<h1 class="h1">처음 설정</h1>';$('#view').innerHTML=setupHTML()}
    else{
      $('#head').innerHTML=headHTML();
      $('#view').innerHTML=state.tab==='hist'?histHTML():state.tab==='sum'?sumHTML():logHTML();
    }
    document.querySelectorAll('.nav button').forEach(function(b){
      if(b.dataset.t===state.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
    });
    if(fid){var n=document.getElementById(fid);if(n){n.focus();if(pos&&n.setSelectionRange){try{n.setSelectionRange(pos[0],pos[1])}catch(e){}}}}
  }

  /* ---------- 이벤트 ---------- */
  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-act]');if(!t)return;
    var a=t.dataset.act,ex=t.dataset.ex;
    if(a==='tab'){state.tab=t.dataset.t;render();window.scrollTo(0,0)}
    else if(a==='routine')pickRoutine(t.dataset.r);
    else if(a==='rtadd')addRoutine();
    else if(a==='su-n'){state.setup=setupFor(+t.dataset.n,state.setup.fill);render()}
    else if(a==='su-go')finishSetup();
    else if(a==='tipok')closeTip();
    else if(a==='rtdel')delRoutine();
    else if(a==='toggle'){state.open=state.open===ex?null:ex;render()}
    else if(a==='adj'){
      var dr=state.drafts[ex];if(!dr)return;var dl=parseFloat(t.dataset.d),v=num(dr[t.dataset.f]);if(isNaN(v))v=0;
      if(t.dataset.f==='w')dr.w=fmtNum(Math.max(0,Math.round((v+dl)*10)/10));else dr.r=String(Math.max(1,Math.round(v+dl)));
      render();
    }
    else if(a==='add')addSet(ex);
    else if(a==='delset')delSet(ex,parseInt(t.dataset.i,10));
    else if(a==='undo')undo();
    else if(a==='edit'){state.edit=!state.edit;state.rm=null;state.rtdel=null;render()}
    else if(a==='rmex'){if(state.rm===ex)rmEx(ex);else{state.rm=ex;render()}}
    else if(a==='deldoc')delDoc(t.dataset.id);
    else if(a==='reststop')stopRest();
    else if(a==='goto'){state.date=t.dataset.date;state.routine=t.dataset.r;state.tab='log';state.open=null;render();window.scrollTo(0,0)}
  });
  document.addEventListener('input',function(e){
    var t=e.target;
    if(t.dataset&&t.dataset.f&&t.dataset.ex){var dr=state.drafts[t.dataset.ex];if(dr)dr[t.dataset.f]=t.value}
    else if(state.setup&&t.dataset&&t.dataset.su)state.setup.names[+t.dataset.su]=t.value;
  });
  document.addEventListener('keydown',function(e){
    var t=e.target;
    if(e.key==='Enter'&&t.dataset&&t.dataset.f&&t.dataset.ex){e.preventDefault();addSet(t.dataset.ex)}
    else if(e.key==='Enter'&&t.id==='rtname'){e.preventDefault();t.blur()}
  });
  document.addEventListener('change',function(e){
    if(e.target.id==='datein'){state.date=e.target.value||today();state.open=null;render()}
    else if(e.target.id==='rtname')renameRoutine(e.target.value);
    else if(e.target.id==='sufill'&&state.setup)state.setup.fill=e.target.checked;  });
  document.addEventListener('submit',function(e){
    e.preventDefault();
    if(e.target.id==='addex'){addEx($('#newex').value)}
  });

  /* ---------- 꾹 눌러서 순서 바꾸기 (종목 머리, 루틴 버튼) ---------- */
  /* 처음 한 번 뜨는 안내 말풍선 */
  var TIP_KEY='ppl-tip-drag';
  function tipSeen(){try{return !!localStorage.getItem(TIP_KEY)}catch(e){return true}}
  function tipHTML(){
    return '<div class="tip" id="tip" role="note"><span class="tipic" aria-hidden="true"><i></i><i></i></span>'+
      '<span class="tiptx"><b>꾹 눌러서 끌어봐</b><span>종목과 루틴 순서를 바꿀 수 있어</span></span>'+
      '<button data-act="tipok">알겠어</button></div>';
  }
  function closeTip(quiet){
    try{localStorage.setItem(TIP_KEY,'1')}catch(e){}
    var t=$('#tip');if(!t)return;
    if(quiet){t.remove();return}
    t.classList.add('out');setTimeout(function(){t.remove()},220);
  }

  /* 아이폰 홈 화면 아이콘처럼: 꾹 누르면 떠오르고, 손가락을 그대로 따라오고, 나머지는 부드럽게 비켜준다 */
  var drag=null,press=null,noClick=false,scrollRaf=0;
  var EASE='cubic-bezier(.2,.8,.2,1)',LIFT=1.05;
  function dragSibs(d){return Array.prototype.filter.call(d.item.parentNode.children,function(c){return c!==d.item&&(d.kind==='ex'?c.classList.contains('ex'):c.dataset.act==='routine')})}
  function inParent(d,x,y){var op=d.item.offsetParent||document.body,r=op.getBoundingClientRect();return {x:x-r.left-op.clientLeft,y:y-r.top-op.clientTop}}
  function follow(d){
    var p=inParent(d,d.cx,d.cy);
    d.item.style.transform='translate('+(p.x-d.gx-d.item.offsetLeft)+'px,'+(p.y-d.gy-d.item.offsetTop)+'px) scale('+LIFT+')';
  }
  function reorder(d){
    var ex=d.kind==='ex',it=d.item,box=it.parentNode,sibs=dragSibs(d),p=inParent(d,d.cx,d.cy),ref=null;
    // 떠 있는 카드의 가운데가 어느 칸 가운데를 넘었는지로 자리를 정한다
    var c=ex?p.y-d.gy+it.offsetHeight/2:p.x-d.gx+it.offsetWidth/2;
    for(var i=0;i<sibs.length;i++){var s=sibs[i];if(c<(ex?s.offsetTop+s.offsetHeight/2:s.offsetLeft+s.offsetWidth/2)){ref=s;break}}
    var target=ref||(sibs.length?sibs[sibs.length-1].nextSibling:null);
    if(target===it||it.nextSibling===target||(!ref&&sibs.length&&sibs[sibs.length-1].nextElementSibling===it))return;
    var before=sibs.map(function(s){return [s.offsetLeft,s.offsetTop]});
    box.insertBefore(it,target);
    sibs.forEach(function(s,i){
      var dx=before[i][0]-s.offsetLeft,dy=before[i][1]-s.offsetTop;if(!dx&&!dy)return;
      s.style.transition='none';s.style.transform='translate('+dx+'px,'+dy+'px)';
      s.getBoundingClientRect();
      s.style.transition='transform .28s '+EASE;s.style.transform='';
    });
  }
  function autoScroll(){
    scrollRaf=0;if(!drag||drag.kind!=='ex')return;
    var top=($('.top')||document.body).getBoundingClientRect().bottom,bot=window.innerHeight-70,v=0;
    if(drag.cy<top+50)v=-Math.ceil((top+50-drag.cy)/6);else if(drag.cy>bot-50)v=Math.ceil((drag.cy-bot+50)/6);
    if(v){window.scrollBy(0,v);follow(drag);reorder(drag);follow(drag)}
    scrollRaf=requestAnimationFrame(autoScroll);
  }
  document.addEventListener('pointerdown',function(e){
    if(e.button>0||state.setup||drag)return;
    var h=e.target.closest('.exhead,.seg [data-act="routine"]');if(!h)return;
    var item=h.classList.contains('exhead')?h.closest('.ex'):h;
    if(press)clearTimeout(press.timer);
    // 편집 모드: ≡ 손잡이는 누르는 즉시, 루틴 버튼은 움직이기 시작하면 바로 끌기. 그 밖엔 꾹 눌러야(0.4초) 끌기
    if(e.target.closest('.grip')){startDrag(item,e.pointerId,e.clientX,e.clientY);return}
    press={id:e.pointerId,x:e.clientX,y:e.clientY,item:item,moveStarts:state.edit&&!item.classList.contains('ex'),timer:setTimeout(function(){
      var p=press;press=null;startDrag(p.item,p.id,p.x,p.y);
    },400)};
  });
  function startDrag(item,id,x,y){
    if(tipSeen()===false)closeTip(true);
    var d={kind:item.classList.contains('ex')?'ex':'rt',item:item,id:id,cx:x,cy:y};
    var p=inParent(d,x,y);d.gx=p.x-item.offsetLeft;d.gy=p.y-item.offsetTop;
    drag=d;item.classList.add('dragging');document.body.classList.add('drag');
    item.style.transition='transform .2s '+EASE+', box-shadow .2s';item.style.transform='scale('+LIFT+')';
    if(d.kind==='ex')scrollRaf=requestAnimationFrame(autoScroll);
  }
  document.addEventListener('pointermove',function(e){
    if(press&&e.pointerId===press.id&&Math.abs(e.clientX-press.x)+Math.abs(e.clientY-press.y)>(press.moveStarts?6:10)){
      var p=press;clearTimeout(p.timer);press=null;
      if(p.moveStarts)startDrag(p.item,p.id,p.x,p.y);
    }
    if(!drag||e.pointerId!==drag.id)return;
    e.preventDefault();
    drag.cx=e.clientX;drag.cy=e.clientY;
    drag.item.style.transition='box-shadow .2s';
    reorder(drag);follow(drag);
  });
  function endDrag(){
    if(press){clearTimeout(press.timer);press=null}
    if(!drag)return;
    var d=drag;drag=null;cancelAnimationFrame(scrollRaf);scrollRaf=0;
    noClick=true;setTimeout(function(){noClick=false},500);
    // 제자리로 내려앉는 모션이 끝난 뒤에 저장(저장하면 화면을 다시 그리기 때문)
    d.item.style.transition='transform .26s '+EASE+', box-shadow .26s';d.item.style.transform='';d.item.classList.remove('dragging');
    setTimeout(function(){document.body.classList.remove('drag');commitOrder(d)},270);
  }
  function commitOrder(d){
    dragSibs(d).concat(d.item).forEach(function(s){s.style.transition='';s.style.transform=''});
    if(d.kind==='ex'){
      var names=Array.prototype.map.call(document.querySelectorAll('#view .ex'),function(s){return s.dataset.name});
      if(names.join('\n')!==listFor(state.routine).join('\n'))mutateLists(function(l){l[state.routine]=names});
    }else{
      var keys=Array.prototype.map.call(document.querySelectorAll('.seg [data-act="routine"]'),function(b){return b.dataset.r});
      var cur=shownR().map(function(r){return r.k});
      if(keys.join()!==cur.join())mutateLists(function(){
        ROUTINES=keys.map(rk).concat(ROUTINES.filter(function(r){return r.off}));
      });
    }
  }
  document.addEventListener('pointerup',endDrag);
  document.addEventListener('pointercancel',endDrag);
  // 끄는 중에는 화면 스크롤·길게 누르기 메뉴를 막고, 손 뗀 직후의 탭(열기/루틴 선택)은 무시
  document.addEventListener('touchmove',function(e){if(drag)e.preventDefault()},{passive:false});
  document.addEventListener('contextmenu',function(e){if(drag||press)e.preventDefault()});
  document.addEventListener('click',function(e){if(noClick){noClick=false;e.stopPropagation();e.preventDefault()}},true);

  /* ---------- 시작 ---------- */
  render();
  store=makeLocalStore();
  store.subCfg(applyCfg);
  store.sub(applyLogs);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
